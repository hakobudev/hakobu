name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_call: # the release runs it first

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - run: go build ./...
      - run: go vet ./...
      - run: go test ./...

      - uses: sqlc-dev/setup-sqlc@v5
        with:
          sqlc-version: "1.31.1"
      - name: generated store code is up to date
        run: sqlc diff

      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  lint:
    # only-new-issues has nothing to compare a tag with; main was linted.
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      # The existing code has known issues; PRs are held only to what they add.
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14.0
          only-new-issues: true
